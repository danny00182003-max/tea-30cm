name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# GITHUB_TOKEN 需要這些權限才能發布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；不取消進行中的，讓它跑完
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 lockfile 精準安裝，確保與本機同版
      - run: npm ci

      - run: npm run build

      # enablement: 若 repo 尚未啟用 Pages 就自動啟用，
      # 免去必須先到 Settings 手動切換 Source 的順序問題
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
